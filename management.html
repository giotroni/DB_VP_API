<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management V&P - Vaglio & Partners</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/images/fav-icon.ico">
    
    <!-- CSS Frameworks -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link href="assets/css/vp-theme.css" rel="stylesheet">
    <link href="assets/css/management.css" rel="stylesheet">
    <!-- Aggiungo il nuovo file CSS -->
    <link href="assets/css/giornate-section.css" rel="stylesheet">
    
    <!-- Meta tags for SEO and sharing -->
    <meta name="description" content="Sistema di gestione per amministratori Vaglio & Partners - Gestione commesse, clienti, collaboratori">
    <meta name="keywords" content="management, gestione, vaglio partners, commesse, clienti, collaboratori, amministrazione">
    <meta name="author" content="Vaglio & Partners">
    
    <!-- Open Graph meta tags -->
    <meta property="og:title" content="Management V&P">
    <meta property="og:description" content="Sistema di gestione per amministratori Vaglio & Partners">
    <meta property="og:type" content="website">
    
    <!-- Preload key resources -->
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-content">
            <div class="loading-spinner-large"></div>
            <h2>Caricamento V&P Management...</h2>
        </div>
    </div>

    <!-- Main Application Container -->
    <div id="appContainer">
        <!-- L'interfaccia viene caricata dinamicamente tramite JavaScript -->
    </div>

    <!-- Modals e componenti di utilità -->
    
    <!-- Toast container per notifiche -->
    <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer">
        <!-- I toast vengono inseriti qui dinamicamente -->
    </div>

    <!-- JavaScript Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript - Carica API client prima di management.js -->
    <!-- Script loading order -->
    <script src="assets/js/modules/api.js"></script>
    <script src="assets/js/modules/ui-components.js"></script>
    <script src="assets/js/modules/utils.js"></script>

    <script src="assets/js/modules/sections/base-section.js"></script>
    <script src="assets/js/modules/sections/commesse-task-section.js"></script>
    <script src="assets/js/modules/sections/clienti-section.js"></script>
    <script src="assets/js/modules/sections/collaboratori-section.js"></script>
    <script src="assets/js/modules/sections/tariffe-section.js"></script>
    <script src="assets/js/modules/sections/fatture-section.js"></script>
    <script src="assets/js/modules/sections/giornate-section.js"></script>
    <script src="assets/js/modules/sections/statistiche-section.js"></script>
    <script src="assets/js/management.js"></script>


    <!-- Service Worker per cache (opzionale per PWA) -->
    <script>
        // Rimozione loading screen quando l'app è caricata
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loadingScreen = document.getElementById('loadingScreen');
                if (loadingScreen) {
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                    }, 300);
                }
            }, 500);
        });
    </script>

</body>
</html>
