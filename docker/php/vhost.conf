<VirtualHost *:80>
    # DocumentRoot = radice del repo: obbligatorio perche' API/ConsuntivazioneAPI.php
    # costruisce URL assoluti come /DB/uploads/consuntivazioni
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html consuntivazione.html
    </Directory>

    # Fuori portata dal browser: repo git e dump di produzione
    <DirectoryMatch "/var/www/html/(\.git|DB/Backup)">
        Require all denied
    </DirectoryMatch>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
